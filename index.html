<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galvez Martin</title>
  <meta name="description" content="Galvez Martin — étudiant M2 au CEIPI, joueur d'échecs et de poker, bâtisseur de sites, d'agents autonomes, de mosaïques et de drones.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
  <!-- HERO -->
  <header class="hero" id="top">
    <div class="hero-photo" role="img" aria-label="Décollage d'une fusée au coucher du soleil"></div>
    <div class="hero-shade" aria-hidden="true"></div>

    <nav class="nav">
      <a class="logo" href="#top"><span data-edit="profile.logo"></span><sup>®</sup></a>
      <div class="nav-links">
        <a href="#top"><span class="nav-num">01</span>Accueil</a>
        <a href="#profil"><span class="nav-num">02</span>À propos</a>
        <a href="#activites"><span class="nav-num">03</span>Activités</a>
      </div>
    </nav>

    <div class="hero-inner">
      <span class="pill"><span class="spark">✦</span> <span data-edit="profile.badge"></span></span>
      <h1 class="hero-title" data-edit="profile.name"></h1>
    </div>

    <div class="hero-bottom">
      <span class="hero-credit" data-edit="profile.heroCredit"></span>
      <a class="scroll-cue" href="#profil"><span class="section-num">01</span> Défiler pour découvrir <span class="arrow-down">↓</span></a>
      <div class="hero-lead">
        <p><strong data-edit="profile.leadStrong"></strong> <span data-edit="profile.lead"></span></p>
        <a class="link-arrow" href="#activites">Voir mes activités <span>→</span></a>
      </div>
    </div>
  </header>

  <main>
    <!-- PARTIE 2 : À PROPOS -->
    <section class="section about" id="profil">
      <div class="section-head reveal">
        <span class="section-num">02</span>
        <h2 class="section-title">À <em>propos</em></h2>
        <span class="section-rule" aria-hidden="true"></span>
        <span class="section-meta">Qui je suis</span>
      </div>

      <article class="card about-card reveal">
        <div class="about-portrait" id="portrait"></div>
        <div class="about-info">
          <div class="about-top">
            <span class="eyebrow" data-edit="profile.role"></span>
            <span class="about-level" id="aboutLevel"></span>
          </div>
          <h3 class="about-name" data-edit="profile.name"></h3>
          <p class="about-tagline" data-edit="profile.tagline"></p>
          <p class="about-bio" data-edit="profile.intro"></p>

          <hr class="rule">
          <span class="eyebrow">En bref</span>
          <dl class="inventory" id="inventory"></dl>
          <button type="button" class="icon-btn edit-only add-inventory" id="addInventory">＋ Ajouter une ligne</button>

          <hr class="rule">
          <span class="eyebrow">Devise</span>
          <p class="about-motto" data-edit="profile.motto"></p>
        </div>
      </article>

      <div class="traits" id="traits"></div>
    </section>

    <!-- PARTIE 3 : ACTIVITÉS -->
    <section class="section activities-section" id="activites">
      <div class="section-head reveal">
        <span class="section-num">03</span>
        <h2 class="section-title">Mes <em>activités</em></h2>
        <span class="section-rule" aria-hidden="true"></span>
        <span class="section-meta" id="activitiesMeta"></span>
      </div>

      <div class="activities-intro">
        <p class="lead">Chaque projet avance en trois temps : <span class="tag tag-done">Accompli</span> <span class="tag tag-doing">En cours</span> <span class="tag tag-todo">À exécuter</span>.</p>
        <div class="global-progress" id="globalProgress"></div>
      </div>

      <div class="activities" id="activities"></div>

      <button class="btn btn-ghost edit-only add-activity" id="addActivity" type="button">+ Ajouter une activité</button>
    </section>

    <!-- CONTACT -->
    <section class="section contact" id="contact">
      <h2 class="display huge">Parlons<em>-en</em></h2>
      <div class="contact-links">
        <a class="link-arrow" id="mailLink" href="#"><span data-edit="profile.email"></span> <span>→</span></a>
        <a class="link-arrow" id="twitterLink" href="#" target="_blank" rel="noopener"><span data-edit="profile.twitter"></span> <span>→</span></a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>© <span id="year"></span> <span data-edit="profile.name"></span></span>
    <a href="#edit" class="edit-trigger" id="editTrigger" title="Mode édition">✎ Éditer</a>
  </footer>

  <!-- Barre d'édition -->
  <div class="editbar" id="editbar" role="toolbar" aria-label="Outils d'édition">
    <span class="editbar-title"><span class="dot"></span> Mode édition</span>
    <span class="editbar-status" id="saveStatus">Enregistré</span>
    <div class="editbar-actions">
      <button class="btn btn-small" id="exportBtn" type="button" title="Mettre en ligne les modifications">Publier</button>
      <label class="btn btn-small" title="Recharger une sauvegarde (data.js ou .json)">Importer<input type="file" id="importInput" accept=".js,.json,application/json,text/javascript" hidden></label>
      <button class="btn btn-small btn-danger" id="resetBtn" type="button" title="Effacer les modifications locales">Réinitialiser</button>
      <button class="btn btn-small btn-solid" id="exitEdit" type="button">Terminer</button>
    </div>
  </div>

  <!-- Visionneuse photo -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" type="button" aria-label="Fermer">×</button>
    <button class="lightbox-nav prev" type="button" aria-label="Photo précédente">←</button>
    <figure><img alt=""><figcaption></figcaption></figure>
    <button class="lightbox-nav next" type="button" aria-label="Photo suivante">→</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
